# Bygger Blink Buddy automatisk til Windows (exe) og Mac (app) på GitHubs maskiner.
# Læg mappen i et GitHub-repositorium. Hvert push til main bygger begge
# (hentes under Actions → Artifacts). Et tag som v1.0.0 laver desuden en
# Release med filerne, som dryeye.dk kan linke direkte til:
#   https://github.com/<bruger>/<repo>/releases/latest/download/Blink-Buddy.exe
#   https://github.com/<bruger>/<repo>/releases/latest/download/Blink-Buddy-mac.zip
name: Byg Windows og Mac
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -c "import os,sys; os.environ['QT_QPA_PLATFORM']='offscreen'; from PySide6.QtWidgets import QApplication; a=QApplication(sys.argv); import blink_buddy as b; b.generate_icon('blink_buddy.ico')"
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Blink Buddy" --icon blink_buddy.ico --add-data "blink_buddy.ico;." --add-data "frames;frames" blink_buddy.py
      - run: Copy-Item "dist/Blink Buddy.exe" "dist/Blink-Buddy.exe"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Blink-Buddy-Windows
          path: dist/Blink-Buddy.exe

  mac:
    # To Mac-udgaver: Apple-chip (M1 og nyere) og Intel. macos-latest er Apple-chip.
    strategy:
      matrix:
        include:
          - runner: macos-latest
            zip: Blink-Buddy-mac.zip
            dmg: Blink-Buddy-mac.dmg
            artifact: Blink-Buddy-Mac
          - runner: macos-15-intel
            zip: Blink-Buddy-mac-intel.zip
            dmg: Blink-Buddy-mac-intel.dmg
            artifact: Blink-Buddy-Mac-Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: QT_QPA_PLATFORM=offscreen python -c "import sys; from PySide6.QtWidgets import QApplication; a=QApplication(sys.argv); import blink_buddy as b; b.generate_icon('blink_buddy.ico'); b.generate_icns('blink_buddy.icns')"
      - run: python -m PyInstaller --noconfirm --clean --windowed --name "Blink Buddy" --icon blink_buddy.icns --osx-bundle-identifier dk.dryeye.blinkbuddy --add-data "blink_buddy.ico:." --add-data "frames:frames" blink_buddy.py
      - run: plutil -replace LSUIElement -bool true "dist/Blink Buddy.app/Contents/Info.plist"
      # Info.plist blev ændret efter PyInstallers signering, så signaturen er ugyldig.
      # Uden ny (ad hoc) signatur siger macOS, at appen "er beskadiget".
      - run: codesign --force --deep --sign - "dist/Blink Buddy.app" && codesign --verify --deep --strict "dist/Blink Buddy.app"
      - run: ditto -c -k --keepParent "dist/Blink Buddy.app" "dist/${{ matrix.zip }}"
      # Installationsfil (.dmg): åbner et vindue med Blink Buddy og en genvej til Programmer,
      # så man bare trækker det ene over i det andet.
      - run: |
          mkdir -p dmg && cp -R "dist/Blink Buddy.app" dmg/ && ln -s /Applications dmg/Programmer
          hdiutil create -volname "Blink Buddy" -srcfolder dmg -ov -format UDZO "dist/${{ matrix.dmg }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.zip }}
            dist/${{ matrix.dmg }}

  release:
    # Hvert push til main udgiver en Release med versionsnummeret fra blink_buddy.py
    # (APP_VERSION). Samme version igen opdaterer filerne i den eksisterende Release.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "v=v$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' blink_buddy.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            out/Blink-Buddy-Windows/Blink-Buddy.exe
            out/Blink-Buddy-Mac/Blink-Buddy-mac.zip
            out/Blink-Buddy-Mac-Intel/Blink-Buddy-mac-intel.zip
            out/Blink-Buddy-Mac/Blink-Buddy-mac.dmg
            out/Blink-Buddy-Mac-Intel/Blink-Buddy-mac-intel.dmg
          name: Blink Buddy ${{ steps.ver.outputs.v }}
          body: "Blink Buddy til Windows og Mac. Programmerne er ikke kodesigneret hos Microsoft eller Apple: på Windows vælges 'Flere oplysninger' og 'Kør alligevel'; på Mac åbnes appen første gang via Systemindstillinger → Anonymitet og sikkerhed → 'Åbn alligevel'. Blink-Buddy-mac.zip er til Mac med Apple-chip (M1 og nyere), Blink-Buddy-mac-intel.zip til Mac med Intel."
